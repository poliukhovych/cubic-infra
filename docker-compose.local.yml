# Overlay for running locally on top of docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile
    ports:
      - "80:80"

  db:
    ports:
      - "127.0.0.1:5432:5432"

  main_api:
    ports:
      - "127.0.0.1:8000:8000"
    # Mount local sources over the image so backend edits work without a rebuild
    volumes:
      - ../cubic-backend:/app

  scheduler_api:
    ports:
      - "127.0.0.1:8001:8000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
